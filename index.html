<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math002</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#16241f;
    --board-2:#1d3129;
    --chalk:#ede8da;
    --chalk-dim:#b9c2ba;
    --gold:#d7a034;
    --teal-line:#33473d;
    --coral:#e2694b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% 0%, #1c2f27 0%, var(--board) 55%),
      var(--board);
    color:var(--chalk);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--teal-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--teal-line) 1px, transparent 1px);
    background-size:34px 34px;
    opacity:0.16;
    pointer-events:none;
    z-index:0;
  }
  .wrap{position:relative; z-index:1; max-width:980px; margin:0 auto; padding:36px 22px 80px;}

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .brand{
    font-family:'Reem Kufi', sans-serif;
    font-size:1.15rem;
    color:var(--gold);
    letter-spacing:.5px;
    cursor:pointer;
    display:flex; align-items:center; gap:10px;
  }
  .brand svg{width:26px;height:26px;flex-shrink:0;}
  .crumbs{display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--chalk-dim);}
  .crumbs span{cursor:pointer;}
  .crumbs span:hover{color:var(--gold);}
  .crumbs .sep{opacity:.5;}

  .view{display:none;}
  .view.active{display:block;}

  /* COURSE HOME (top level) */
  .course-hero{
    min-height:70vh;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    flex-direction:column;
  }
  .course-icon{
    width:64px;height:64px;
    margin:0 auto 22px;
    border-radius:50%;
    border:1.5px dashed rgba(215,160,52,.4);
    display:flex; align-items:center; justify-content:center;
  }
  .course-icon svg{width:30px;height:30px;}
  .course-eyebrow{color:var(--gold); font-size:.82rem; letter-spacing:1px; margin:0 0 8px;}
  .course-title{
    font-family:'Reem Kufi', sans-serif;
    font-size:clamp(2.2rem, 8vw, 3.2rem);
    margin:0;
    color:var(--chalk);
  }
  .underline{
    display:inline-block;
    width:120px; height:6px;
    margin:16px auto 26px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 16px);
    border-radius:3px;
  }
  .course-desc{
    color:var(--chalk-dim);
    font-size:.95rem;
    line-height:1.9;
    margin:0 auto 34px;
    max-width:380px;
  }
  .chapter-btns{
    display:flex; flex-wrap:wrap; gap:14px; justify-content:center; max-width:600px;
  }
  .chapter-btn-wrap{display:inline-block;}
  .chapter-btn{
    background:var(--board-2);
    border:1.5px solid var(--gold);
    color:var(--gold);
    font-family:'Cairo', sans-serif;
    font-size:.95rem;
    font-weight:600;
    padding:13px 26px;
    border-radius:999px;
    cursor:pointer;
    transition:.2s;
  }
  .chapter-btn:hover{background:var(--gold); color:#16241f;}

  .delete-btn{
    margin-top:22px;
    background:transparent;
    border:1.5px dashed var(--coral);
    color:var(--coral);
    font-family:'Cairo', sans-serif;
    font-size:.82rem;
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
    transition:.2s;
  }
  .delete-btn:hover{background:var(--coral); color:var(--board);}
  .delete-btn.active{background:var(--coral); color:var(--board); border-style:solid;}

  @keyframes wiggle{
    0%{ transform:rotate(-1.5deg); }
    50%{ transform:rotate(1.5deg); }
    100%{ transform:rotate(-1.5deg); }
  }
  .delete-mode .chapter-btn-wrap,
  .delete-mode .chap-card{
    animation:wiggle .22s infinite;
  }
  .delete-mode .chapter-btn,
  .delete-mode .chap-card{
    border-color:var(--coral) !important;
  }
  .delete-mode .chapter-btn-wrap:nth-child(2n) .chapter-btn,
  .delete-mode .chap-card:nth-child(2n){
    animation-delay:.08s;
  }

  .add-btn{
    margin-top:30px;
    background:transparent;
    border:1.5px dashed var(--teal-line);
    color:var(--chalk-dim);
    font-family:'Cairo', sans-serif;
    font-size:.82rem;
    padding:10px 20px;
    border-radius:999px;
    cursor:pointer;
    transition:.2s;
  }
  .add-btn:hover{border-color:var(--gold); color:var(--gold);}

  .inline-form{
    display:none;
    margin-top:22px;
    width:100%;
    max-width:380px;
    background:var(--board-2);
    border:1px solid var(--teal-line);
    border-radius:var(--radius);
    padding:20px;
    text-align:right;
  }
  .inline-form.open{display:block;}
  .inline-form label{
    display:block;
    font-size:.78rem;
    color:var(--gold);
    margin:0 0 6px;
  }
  .inline-form .f-row{margin-bottom:14px;}
  .inline-form .f-row:last-of-type{margin-bottom:0;}
  .inline-form input[type=text],
  .inline-form input[type=url]{
    width:100%;
    background:var(--board);
    border:1px solid var(--teal-line);
    border-radius:8px;
    padding:10px 12px;
    color:var(--chalk);
    font-family:'Cairo', sans-serif;
    font-size:.88rem;
    direction:rtl;
    outline:none;
  }
  .inline-form input[type=text]:focus,
  .inline-form input[type=url]:focus{border-color:var(--gold);}
  .inline-form .checkbox-row{
    display:flex; align-items:center; gap:8px;
    font-size:.85rem; color:var(--chalk-dim);
    margin-bottom:16px;
  }
  .inline-form .checkbox-row input{accent-color:var(--gold);}
  .inline-form .f-actions{display:flex; gap:10px; margin-top:18px;}
  .inline-form .f-actions button{
    flex:1;
    padding:10px 14px;
    border-radius:8px;
    font-family:'Cairo', sans-serif;
    font-size:.85rem;
    cursor:pointer;
    transition:.18s;
  }
  .inline-form .btn-save{
    background:var(--gold); border:1px solid var(--gold); color:#16241f; font-weight:700;
  }
  .inline-form .btn-save:hover{opacity:.88;}
  .inline-form .btn-cancel{
    background:transparent; border:1px solid var(--teal-line); color:var(--chalk-dim);
  }
  .inline-form .btn-cancel:hover{border-color:var(--coral); color:var(--coral);}
  .inline-form .f-hint{font-size:.72rem; color:var(--chalk-dim); margin-top:6px; line-height:1.6;}

  /* CUSTOM CONFIRM MODAL (native confirm() is blocked in sandboxed previews) */
  .confirm-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(10,16,14,.72);
    z-index:50;
    align-items:center; justify-content:center;
    padding:20px;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-box{
    background:var(--board-2);
    border:1px solid var(--coral);
    border-radius:var(--radius);
    padding:24px 22px;
    max-width:340px;
    text-align:center;
  }
  .confirm-box p{
    color:var(--chalk);
    font-size:.92rem;
    line-height:1.8;
    margin:0 0 20px;
  }
  .confirm-box .f-actions{display:flex; gap:10px;}
  .confirm-box .f-actions button{
    flex:1; padding:10px 14px; border-radius:8px;
    font-family:'Cairo', sans-serif; font-size:.85rem; cursor:pointer; transition:.18s;
  }
  .confirm-box .btn-yes{background:var(--coral); border:1px solid var(--coral); color:var(--board); font-weight:700;}
  .confirm-box .btn-yes:hover{opacity:.85;}
  .confirm-box .btn-no{background:transparent; border:1px solid var(--teal-line); color:var(--chalk-dim);}
  .confirm-box .btn-no:hover{border-color:var(--gold); color:var(--gold);}

  /* FILES ATTACHMENTS */
  .files-box{
    margin-top:28px;
    border-radius:var(--radius);
    border:1px solid var(--teal-line);
    padding:16px 18px;
  }
  .files-box .n-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .files-box .n-head strong{font-size:.9rem; color:var(--chalk); font-family:'Reem Kufi', sans-serif; font-weight:400;}
  .file-add-btn{
    background:transparent;
    border:1.5px dashed var(--gold);
    color:var(--gold);
    font-family:'Cairo', sans-serif;
    font-size:.78rem;
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:.2s;
  }
  .file-add-btn:hover{background:var(--gold); color:#16241f;}
  .file-list{display:flex; flex-direction:column; gap:8px;}
  .file-empty{font-size:.82rem; color:var(--chalk-dim); padding:6px 2px;}
  .file-item{
    display:flex; align-items:center; gap:10px;
    background:var(--board-2);
    border:1px solid var(--teal-line);
    border-radius:10px;
    padding:10px 12px;
  }
  .file-item .f-icon{
    width:32px;height:32px; flex-shrink:0;
    border-radius:8px;
    background:rgba(215,160,52,.12);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold);
    font-size:.7rem;
    font-weight:700;
  }
  .file-item .f-name{
    flex:1; min-width:0;
    font-size:.85rem; color:var(--chalk);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-decoration:none;
  }
  .file-item .f-name:hover{color:var(--gold);}
  .file-item .f-size{font-size:.72rem; color:var(--chalk-dim); flex-shrink:0;}
  .file-item .f-del{
    background:transparent; border:none; color:var(--coral);
    cursor:pointer; font-size:.9rem; flex-shrink:0; padding:4px;
  }
  .file-item .f-del:hover{opacity:.7;}

  /* CHAPTER VIEW (list of lessons) */
  .hero{margin:38px 0 34px;}
  .hero h1{
    font-family:'Reem Kufi', sans-serif;
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    margin:0 0 10px;
    color:var(--chalk);
  }
  .hero p{color:var(--chalk-dim); font-size:1rem; max-width:520px; line-height:1.9; margin:0;}

  .timeline{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px,1fr));
    gap:20px;
    margin-top:20px;
  }
  .chap-card{
    position:relative;
    background:linear-gradient(180deg, var(--board-2), #16241f);
    border:1px solid var(--teal-line);
    border-radius:var(--radius);
    padding:22px 20px 20px;
    cursor:pointer;
    transition:transform .18s ease, border-color .18s ease;
  }
  .chap-card:hover{transform:translateY(-4px); border-color:var(--gold);}
  .chap-badge{
    width:46px;height:46px;
    border-radius:50%;
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Reem Kufi',sans-serif;
    font-size:.95rem;
    color:var(--gold);
    margin-bottom:14px;
    position:relative;
  }
  .chap-badge::before{
    content:'';
    position:absolute; inset:-6px;
    border:1.5px dashed rgba(215,160,52,.35);
    border-radius:50%;
  }
  .chap-title{font-size:1.08rem; font-weight:700; margin:0 0 6px; color:var(--chalk);}
  .chap-sub{font-size:.82rem; color:var(--chalk-dim); margin:0;}
  .chap-meta{margin-top:14px; display:flex; align-items:center; gap:6px; font-size:.75rem; color:var(--coral);}
  .chap-card.quiz{border-style:dashed;}
  .chap-card.quiz .chap-badge{border-color:var(--coral); color:var(--coral);}
  .chap-card.quiz .chap-badge::before{border-color:rgba(226,105,75,.35);}

  .add-note{
    margin-top:34px;
    border:1.5px dashed var(--teal-line);
    border-radius:var(--radius);
    padding:16px 18px;
    color:var(--chalk-dim);
    font-size:.85rem;
    line-height:1.9;
  }

  /* LESSON VIEW */
  .chap-header{display:flex; align-items:center; gap:14px; margin:30px 0 20px;}
  .chap-header .badge-big{
    width:58px;height:58px;
    border-radius:50%;
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Reem Kufi',sans-serif;
    font-size:1.1rem;
    color:var(--gold);
    flex-shrink:0;
  }
  .chap-header h2{font-family:'Reem Kufi', sans-serif; font-size:1.5rem; margin:0 0 4px;}
  .chap-header span{color:var(--chalk-dim); font-size:.85rem;}

  .video-block{margin-bottom:22px;}
  .video-block .v-label{font-size:.8rem; color:var(--gold); margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .video-frame-wrap{
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--teal-line);
    aspect-ratio:16/9;
    background:#0f1a16;
  }
  .video-frame-wrap iframe{width:100%; height:100%; border:0; display:block;}

  .video-thumb{
    position:relative;
    display:block;
    width:100%; height:100%;
    background-size:cover;
    background-position:center;
    cursor:pointer;
  }
  .video-thumb::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(15,26,22,.15), rgba(15,26,22,.55));
  }
  .play-btn{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:66px; height:66px;
    border-radius:50%;
    background:rgba(22,36,31,.7);
    border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    z-index:2;
    transition:.18s;
  }
  .video-thumb:hover .play-btn{background:var(--gold);}
  .play-btn svg{width:22px; height:22px; margin-right:-3px;}
  .video-thumb:hover .play-btn svg path{fill:#16241f;}
  .open-hint{
    position:absolute; bottom:12px; right:14px;
    z-index:2;
    font-size:.72rem;
    color:var(--chalk);
    background:rgba(15,26,22,.6);
    padding:5px 10px;
    border-radius:999px;
    border:1px solid var(--teal-line);
  }

  .notes-box{
    margin-top:28px;
    border-radius:var(--radius);
    border:1px solid var(--teal-line);
    background:repeating-linear-gradient(var(--board-2) 0 37px, var(--teal-line) 37px 38px);
    padding:16px 18px;
  }
  .notes-box .n-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .notes-box .n-head strong{font-size:.9rem; color:var(--chalk); font-family:'Reem Kufi', sans-serif; font-weight:400;}
  .save-state{font-size:.72rem; color:var(--chalk-dim);}
  textarea{
    width:100%; min-height:190px; background:transparent; border:none; outline:none; resize:vertical;
    color:var(--chalk); font-family:'Cairo', sans-serif; font-size:.95rem; line-height:38px; direction:rtl;
  }
  textarea::placeholder{color:rgba(237,232,218,0.35);}

  .chap-nav{display:flex; justify-content:space-between; margin-top:26px; gap:12px;}
  .nav-btn{
    flex:1; background:var(--board-2); border:1px solid var(--teal-line); color:var(--chalk-dim);
    padding:12px 14px; border-radius:10px; cursor:pointer; font-family:'Cairo', sans-serif; font-size:.85rem;
    transition:.18s; text-align:center;
  }
  .nav-btn:hover{border-color:var(--gold); color:var(--gold);}
  .nav-btn:disabled{opacity:.3; cursor:default;}
  .nav-btn:disabled:hover{border-color:var(--teal-line); color:var(--chalk-dim);}

  @media (max-width:520px){
    .wrap{padding:24px 14px 60px;}
    .chap-header{gap:10px;}
    .chap-header .badge-big{width:48px;height:48px;font-size:.9rem;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand" onclick="goCourseHome()">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 6c3-2 6-2 8 0v13c-2-2-5-2-8 0V6Z" stroke="#d7a034" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M20 6c-3-2-6-2-8 0v13c2-2 5-2 8 0V6Z" stroke="#d7a034" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      Math002
    </div>
    <div class="crumbs" id="crumbs"></div>
  </header>

  <!-- COURSE HOME -->
  <div class="view active" id="courseView">
    <div class="course-hero">
      <div class="course-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 6c3-2 6-2 8 0v13c-2-2-5-2-8 0V6Z" stroke="#d7a034" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M20 6c-3-2-6-2-8 0v13c2-2 5-2 8 0V6Z" stroke="#d7a034" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="course-eyebrow">منهج</p>
      <h1 class="course-title">Chapters Math002</h1>
      <div class="underline"></div>
      <p class="course-desc">اختر الفصل اللي تبي تذاكره. كل فصل فيه دروسه وفيديوهاته وملاحظاتك.</p>
      <div class="chapter-btns" id="chapterBtns"></div>
      <button class="delete-btn" id="deleteChapBtn" onclick="toggleChapterDeleteMode()">حذف</button>
      <button class="add-btn" onclick="toggleForm('chapterForm')">+ إضافة تشابتر جديد</button>

      <div class="inline-form" id="chapterForm">
        <div class="f-row">
          <label>رقم الفصل (مثال: 4)</label>
          <input type="text" id="newChapNum" placeholder="4">
        </div>
        <div class="f-row">
          <label>اسم الفصل</label>
          <input type="text" id="newChapTitle" placeholder="Chapter 4">
        </div>
        <div class="f-actions">
          <button class="btn-save" onclick="addChapter()">إضافة</button>
          <button class="btn-cancel" onclick="toggleForm('chapterForm')">إلغاء</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CHAPTER VIEW (lessons list) -->
  <div class="view" id="chapterView">
    <div class="hero">
      <h1 id="chapTitle"></h1>
      <p>افتح أي درس، شاهد الفيديو داخل الموقع، ودوّن ملاحظاتك تحته — تنحفظ تلقائي.</p>
    </div>
    <div class="timeline" id="timeline"></div>

    <button class="delete-btn" id="deleteLessonBtn" onclick="toggleLessonDeleteMode()">حذف</button>
    <button class="add-btn" onclick="toggleForm('lessonForm')">+ إضافة درس جديد</button>

    <div class="inline-form" id="lessonForm">
      <div class="f-row">
        <label>رقم الدرس (مثال: 3.7)</label>
        <input type="text" id="newLessonNum" placeholder="3.7">
      </div>
      <div class="f-row">
        <label>اسم الدرس</label>
        <input type="text" id="newLessonTitle" placeholder="الفصل 3.7">
      </div>
      <div class="f-row">
        <label>رابط الفيديو (يوتيوب)</label>
        <input type="url" id="newLessonVideo" placeholder="https://youtu.be/...">
        <div class="f-hint">تقدر تحط أكثر من رابط، افصل بينها بفاصلة إذا فيه أكثر من فيديو للدرس.</div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="newLessonQuiz">
        <label style="margin:0;">هذا كويز / مراجعة</label>
      </div>
      <div class="f-actions">
        <button class="btn-save" onclick="addLesson()">إضافة</button>
        <button class="btn-cancel" onclick="toggleForm('lessonForm')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- LESSON VIEW -->
  <div class="view" id="lessonView">
    <div class="chap-header">
      <div class="badge-big" id="cvBadge"></div>
      <div>
        <h2 id="cvTitle"></h2>
        <span id="cvSub"></span>
      </div>
    </div>

    <div id="cvVideos"></div>

    <div class="files-box">
      <div class="n-head">
        <strong>ملفات مرفقة</strong>
        <button class="file-add-btn" onclick="document.getElementById('fileInput').click()">+ إضافة ملف</button>
      </div>
      <input type="file" id="fileInput" style="display:none" onchange="handleFileAdd(event)">
      <div class="file-list" id="fileList"></div>
    </div>

    <div class="notes-box">
      <div class="n-head">
        <strong>ملاحظاتي</strong>
        <span class="save-state" id="saveState">محفوظ</span>
      </div>
      <textarea id="notesArea" placeholder="اكتب هنا شرحك للدرس وأنت تتفرج... تنحفظ تلقائيًا."></textarea>
    </div>

    <div class="chap-nav">
      <button class="nav-btn" id="prevBtn">← الدرس السابق</button>
      <button class="nav-btn" id="nextBtn">الدرس التالي →</button>
    </div>
  </div>

</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMsg"></p>
    <div class="f-actions">
      <button class="btn-yes" id="confirmYesBtn">حذف</button>
      <button class="btn-no" onclick="closeConfirm()">إلغاء</button>
    </div>
  </div>
</div>

<script>
  // ---- Course data: add more chapters / lessons here later ----
  const course = {
    name: 'Math002',
    chapters: [
      {
        id: 'ch3',
        num: '3',
        title: 'Chapter 3',
        lessons: [
          { id: '3-1', num: '3.1', title: 'الفصل 3.1', videos: ['fpIuXwTIdsw'] },
          { id: '3-3', num: '3.3', title: 'الفصل 3.3', videos: ['DkV8nNF1220'] },
          { id: '3-4', num: '3.4', title: 'الفصل 3.4', videos: ['ADwvf9NeAPY'] },
          { id: '3-6', num: '3.6', title: 'الفصل 3.6', videos: ['sdHKzYKrycE'] },
          { id: 'quiz-1', num: 'Q1', title: 'كويز 1 - الفصل 3', quiz: true, videos: ['JDqRBndVUr4', 'NrYg5leiuBg'] }
        ]
      }
    ]
  };

  // ---- Load user-added chapters/lessons from localStorage and merge ----
  const STORE_KEY = 'mathhub-user-content';
  function loadUserData(){
    try{
      return JSON.parse(localStorage.getItem(STORE_KEY)) || { chapters: [], lessons: {} };
    }catch(e){
      return { chapters: [], lessons: {} };
    }
  }
  function saveUserData(data){
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }
  const userData = loadUserData();
  userData.chapters.forEach(ch => course.chapters.push(ch));
  Object.keys(userData.lessons).forEach(chId => {
    const ch = course.chapters.find(c => c.id === chId);
    if(ch) userData.lessons[chId].forEach(l => ch.lessons.push(l));
  });

  // ---- Deleted items tracking (so base hard-coded chapters/lessons can be hidden too) ----
  const DELETED_KEY = 'mathhub-deleted';
  function loadDeleted(){
    try{
      return JSON.parse(localStorage.getItem(DELETED_KEY)) || { chapters: [], lessons: [] };
    }catch(e){
      return { chapters: [], lessons: [] };
    }
  }
  function saveDeleted(d){
    localStorage.setItem(DELETED_KEY, JSON.stringify(d));
  }
  const deleted = loadDeleted();
  course.chapters = course.chapters.filter(ch => !deleted.chapters.includes(ch.id));
  course.chapters.forEach(ch => {
    ch.lessons = ch.lessons.filter(l => !deleted.lessons.includes(l.id));
  });

  // ---- Custom confirm modal (native confirm() is blocked in sandboxed previews) ----
  function showAlert(message){
    document.getElementById('confirmMsg').textContent = message;
    document.querySelector('.confirm-box .btn-no').style.display = 'none';
    document.getElementById('confirmYesBtn').textContent = 'حسنًا';
    document.getElementById('confirmOverlay').classList.add('open');
    pendingConfirmAction = null;
  }

  let pendingConfirmAction = null;
  function showConfirm(message, onYes){
    document.getElementById('confirmMsg').textContent = message;
    document.querySelector('.confirm-box .btn-no').style.display = 'block';
    document.getElementById('confirmYesBtn').textContent = 'حذف';
    document.getElementById('confirmOverlay').classList.add('open');
    pendingConfirmAction = onYes;
  }
  function closeConfirm(){
    document.getElementById('confirmOverlay').classList.remove('open');
    pendingConfirmAction = null;
  }
  document.getElementById('confirmYesBtn').onclick = () => {
    const action = pendingConfirmAction;
    closeConfirm();
    if(action) action();
  };

  function deleteChapter(chapterId, title){
    showConfirm('متأكد تبي تحذف "' + title + '" وكل دروسه؟ ما تقدر ترجعه بعدين.', () => {
      deleted.chapters.push(chapterId);
      saveDeleted(deleted);
      course.chapters = course.chapters.filter(ch => ch.id !== chapterId);
      userData.chapters = userData.chapters.filter(ch => ch.id !== chapterId);
      saveUserData(userData);
      renderChapterButtons();
    });
  }

  function deleteLesson(chapterId, lessonId, title){
    showConfirm('متأكد تبي تحذف "' + title + '"؟ ما تقدر ترجعه بعدين.', () => {
      deleted.lessons.push(lessonId);
      saveDeleted(deleted);
      const ch = course.chapters.find(c => c.id === chapterId);
      if(ch) ch.lessons = ch.lessons.filter(l => l.id !== lessonId);
      if(userData.lessons[chapterId]){
        userData.lessons[chapterId] = userData.lessons[chapterId].filter(l => l.id !== lessonId);
        saveUserData(userData);
      }
      openChapter(chapterId);
    });
  }

  function slugify(str){
    return str.toString().trim().toLowerCase()
      .replace(/[^a-z0-9\u0600-\u06FF]+/g, '-')
      .replace(/(^-|-$)/g, '') || ('id-' + Date.now());
  }

  function extractVideoId(url){
    url = url.trim();
    if(!url) return null;
    // already a bare ID
    if(/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
    const patterns = [
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
    ];
    for(const p of patterns){
      const m = url.match(p);
      if(m) return m[1];
    }
    return null;
  }

  function toggleForm(id){
    document.getElementById(id).classList.toggle('open');
  }

  function addChapter(){
    const numEl = document.getElementById('newChapNum');
    const titleEl = document.getElementById('newChapTitle');
    const num = numEl.value.trim();
    let title = titleEl.value.trim();
    if(!title){
      title = num ? ('Chapter ' + num) : '';
    }
    if(!title){
      showAlert('لازم تكتب اسم أو رقم الفصل');
      return;
    }
    const newChapter = { id: 'ch-' + slugify(title), num: num || title, title: title, lessons: [] };
    course.chapters.push(newChapter);
    userData.chapters.push(newChapter);
    saveUserData(userData);
    numEl.value = '';
    titleEl.value = '';
    toggleForm('chapterForm');
    renderChapterButtons();
  }

  let currentOpenChapterId = null;
  let lessonDeleteMode = false;

  function toggleLessonDeleteMode(){
    lessonDeleteMode = !lessonDeleteMode;
    const btn = document.getElementById('deleteLessonBtn');
    btn.textContent = lessonDeleteMode ? 'تم' : 'حذف';
    btn.classList.toggle('active', lessonDeleteMode);
    document.getElementById('timeline').classList.toggle('delete-mode', lessonDeleteMode);
  }

  function addLesson(){
    if(!currentOpenChapterId) return;
    const numEl = document.getElementById('newLessonNum');
    const titleEl = document.getElementById('newLessonTitle');
    const videoEl = document.getElementById('newLessonVideo');
    const quizEl = document.getElementById('newLessonQuiz');

    const num = numEl.value.trim();
    let title = titleEl.value.trim();
    if(!title) title = num ? ('الدرس ' + num) : '';
    if(!title){
      showAlert('لازم تكتب اسم أو رقم الدرس');
      return;
    }
    const rawVideos = videoEl.value.split(',').map(v => v.trim()).filter(Boolean);
    const videos = rawVideos.map(extractVideoId).filter(Boolean);
    if(rawVideos.length && !videos.length){
      showAlert('ما قدرت أفهم رابط الفيديو، تأكد إنه رابط يوتيوب صحيح');
      return;
    }

    const newLesson = {
      id: 'l-' + slugify(title) + '-' + Date.now(),
      num: num || '•',
      title: title,
      quiz: quizEl.checked,
      videos: videos
    };

    const ch = course.chapters.find(c => c.id === currentOpenChapterId);
    ch.lessons.push(newLesson);

    if(!userData.lessons[currentOpenChapterId]) userData.lessons[currentOpenChapterId] = [];
    userData.lessons[currentOpenChapterId].push(newLesson);
    saveUserData(userData);

    numEl.value = '';
    titleEl.value = '';
    videoEl.value = '';
    quizEl.checked = false;
    toggleForm('lessonForm');
    openChapter(currentOpenChapterId);
  }

  const courseView = document.getElementById('courseView');
  const chapterView = document.getElementById('chapterView');
  const lessonView = document.getElementById('lessonView');
  const crumbs = document.getElementById('crumbs');
  const chapterBtns = document.getElementById('chapterBtns');

  function renderChapterButtons(){
    chapterBtns.innerHTML = '';
    course.chapters.forEach(ch => {
      const wrap = document.createElement('div');
      wrap.className = 'chapter-btn-wrap';

      const btn = document.createElement('button');
      btn.className = 'chapter-btn';
      btn.textContent = ch.title;
      btn.onclick = () => {
        if(chapterDeleteMode){
          deleteChapter(ch.id, ch.title);
        }else{
          openChapter(ch.id);
        }
      };
      wrap.appendChild(btn);
      chapterBtns.appendChild(wrap);
    });
  }
  renderChapterButtons();

  let chapterDeleteMode = false;
  function toggleChapterDeleteMode(){
    chapterDeleteMode = !chapterDeleteMode;
    const btn = document.getElementById('deleteChapBtn');
    btn.textContent = chapterDeleteMode ? 'تم' : 'حذف';
    btn.classList.toggle('active', chapterDeleteMode);
    chapterBtns.classList.toggle('delete-mode', chapterDeleteMode);
  }

  function showView(view){
    [courseView, chapterView, lessonView].forEach(v => v.classList.remove('active'));
    view.classList.add('active');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function goCourseHome(){
    crumbs.innerHTML = '';
    showView(courseView);
  }

  function openChapter(chapterId){
    const ch = course.chapters.find(c => c.id === chapterId);
    if(!ch) return;
    currentOpenChapterId = chapterId;
    document.getElementById('lessonForm').classList.remove('open');

    document.getElementById('chapTitle').textContent = ch.title;

    const timeline = document.getElementById('timeline');
    timeline.innerHTML = '';
    lessonDeleteMode = false;
    const delBtn = document.getElementById('deleteLessonBtn');
    delBtn.textContent = 'حذف';
    delBtn.classList.remove('active');
    timeline.classList.remove('delete-mode');

    ch.lessons.forEach(l => {
      const card = document.createElement('div');
      card.className = 'chap-card' + (l.quiz ? ' quiz' : '');
      card.onclick = () => {
        if(lessonDeleteMode){
          deleteLesson(chapterId, l.id, l.title);
        }else{
          openLesson(chapterId, l.id);
        }
      };
      card.innerHTML = `
        <div class="chap-badge">${l.num}</div>
        <p class="chap-title">${l.title}</p>
        <p class="chap-sub">${l.videos.length} ${l.videos.length > 1 ? 'فيديوهات' : 'فيديو'}</p>
        <div class="chap-meta">${l.quiz ? '● مراجعة' : '● درس'}</div>
      `;
      timeline.appendChild(card);
    });

    crumbs.innerHTML = `<span onclick="goCourseHome()">Math002</span><span class="sep">/</span><span>${ch.title}</span>`;
    showView(chapterView);
  }

  let saveTimer = null;

  function openLesson(chapterId, lessonId){
    const ch = course.chapters.find(c => c.id === chapterId);
    if(!ch) return;
    const idx = ch.lessons.findIndex(l => l.id === lessonId);
    if(idx === -1) return;
    renderLesson(ch, idx);
    crumbs.innerHTML = `<span onclick="goCourseHome()">Math002</span><span class="sep">/</span><span onclick="openChapter('${ch.id}')">${ch.title}</span><span class="sep">/</span><span>${ch.lessons[idx].title}</span>`;
    showView(lessonView);
  }

  function renderLesson(ch, idx){
    const l = ch.lessons[idx];
    document.getElementById('cvBadge').textContent = l.num;
    document.getElementById('cvTitle').textContent = l.title;
    document.getElementById('cvSub').textContent = l.quiz ? 'مراجعة وأسئلة' : 'شرح الدرس';

    const videosWrap = document.getElementById('cvVideos');
    videosWrap.innerHTML = '';
    if(!l.videos.length){
      videosWrap.innerHTML = '<div class="add-note">ما فيه فيديو مضاف لهذا الدرس بعد.</div>';
    }
    l.videos.forEach((vid, i) => {
      const block = document.createElement('div');
      block.className = 'video-block';
      block.innerHTML = `
        <div class="v-label">${l.videos.length > 1 ? 'فيديو ' + (i+1) : 'الفيديو'}</div>
        <div class="video-frame-wrap">
          <a class="video-thumb" href="https://youtu.be/${vid}" target="_blank" rel="noopener"
             style="background-image:url('https://img.youtube.com/vi/${vid}/hqdefault.jpg')">
            <div class="play-btn">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z" fill="#ede8da"/></svg>
            </div>
            <span class="open-hint">فتح في يوتيوب ↗</span>
          </a>
        </div>
      `;
      videosWrap.appendChild(block);
    });

    const notesArea = document.getElementById('notesArea');
    const saved = localStorage.getItem('mathhub-notes-' + l.id);
    notesArea.value = saved || '';
    document.getElementById('saveState').textContent = saved ? 'محفوظ' : '';

    notesArea.oninput = () => {
      document.getElementById('saveState').textContent = 'جارٍ الحفظ...';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        localStorage.setItem('mathhub-notes-' + l.id, notesArea.value);
        document.getElementById('saveState').textContent = 'محفوظ';
      }, 500);
    };

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === ch.lessons.length - 1;
    prevBtn.onclick = () => idx > 0 && openLesson(ch.id, ch.lessons[idx-1].id);
    nextBtn.onclick = () => idx < ch.lessons.length-1 && openLesson(ch.id, ch.lessons[idx+1].id);

    currentLessonId = l.id;
    renderFiles(l.id);
  }

  // ---- File attachments per lesson (stored as base64 in localStorage) ----
  const FILES_KEY = 'mathhub-files';
  let currentLessonId = null;

  function loadAllFiles(){
    try{
      return JSON.parse(localStorage.getItem(FILES_KEY)) || {};
    }catch(e){
      return {};
    }
  }
  function saveAllFiles(data){
    try{
      localStorage.setItem(FILES_KEY, JSON.stringify(data));
      return true;
    }catch(e){
      showAlert('المساحة المحلية ممتلئة أو الملف كبير جدًا. جرب ملف أصغر أو احذف مرفقات قديمة.');
      return false;
    }
  }

  function formatSize(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
    return (bytes/(1024*1024)).toFixed(1) + ' MB';
  }

  function fileExtLabel(name){
    const ext = (name.split('.').pop() || '?').toUpperCase();
    return ext.length > 4 ? ext.slice(0,4) : ext;
  }

  function renderFiles(lessonId){
    const allFiles = loadAllFiles();
    const files = allFiles[lessonId] || [];
    const list = document.getElementById('fileList');
    list.innerHTML = '';
    if(!files.length){
      list.innerHTML = '<div class="file-empty">ما فيه ملفات مرفقة بعد.</div>';
      return;
    }
    files.forEach((f, i) => {
      const item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = `
        <div class="f-icon">${fileExtLabel(f.name)}</div>
        <a class="f-name" href="${f.data}" download="${f.name}" title="${f.name}">${f.name}</a>
        <span class="f-size">${formatSize(f.size)}</span>
        <button class="f-del" onclick="deleteFile('${lessonId}', ${i})">✕</button>
      `;
      list.appendChild(item);
    });
  }

  function handleFileAdd(evt){
    const file = evt.target.files[0];
    evt.target.value = '';
    if(!file || !currentLessonId) return;
    if(file.size > 4 * 1024 * 1024){
      showAlert('الملف كبير (' + formatSize(file.size) + '). الحد الأقصى المستحسن حوالي 4MB لأن الحفظ محلي بالمتصفح.');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const allFiles = loadAllFiles();
      if(!allFiles[currentLessonId]) allFiles[currentLessonId] = [];
      allFiles[currentLessonId].push({ name: file.name, size: file.size, data: reader.result });
      if(saveAllFiles(allFiles)){
        renderFiles(currentLessonId);
      }
    };
    reader.readAsDataURL(file);
  }

  function deleteFile(lessonId, index){
    const allFiles = loadAllFiles();
    if(!allFiles[lessonId]) return;
    allFiles[lessonId].splice(index, 1);
    saveAllFiles(allFiles);
    renderFiles(lessonId);
  }
</script>
</body>
</html>
