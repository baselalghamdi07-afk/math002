<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math002</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#16241f;
    --board-2:#1d3129;
    --chalk:#ede8da;
    --chalk-dim:#b9c2ba;
    --gold:#d7a034;
    --teal-line:#33473d;
    --coral:#e2694b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% 0%, #1c2f27 0%, var(--board) 55%),
      var(--board);
    color:var(--chalk);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--teal-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--teal-line) 1px, transparent 1px);
    background-size:34px 34px;
    opacity:0.16;
    pointer-events:none;
    z-index:0;
  }
  .wrap{position:relative; z-index:1; max-width:980px; margin:0 auto; padding:36px 22px 80px;}

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .brand{
    font-family:'Reem Kufi', sans-serif;
    font-size:1.15rem;
    color:var(--gold);
    letter-spacing:.5px;
    cursor:pointer;
    display:flex; align-items:center; gap:10px;
  }
  .brand svg{width:26px;height:26px;flex-shrink:0;}
  .crumbs{display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--chalk-dim);}
  .crumbs span{cursor:pointer;}
  .crumbs span:hover{color:var(--gold);}
  .crumbs .sep{opacity:.5;}

  .view{display:none;}
  .view.active{display:block;}

  /* COURSE HOME (top level) */
  .course-hero{
    min-height:70vh;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    flex-direction:column;
  }
  .course-icon{
    width:64px;height:64px;
    margin:0 auto 22px;
    border-radius:50%;
    border:1.5px dashed rgba(215,160,52,.4);
    display:flex; align-items:center; justify-content:center;
  }
  .course-icon svg{width:30px;height:30px;}
  .course-eyebrow{color:var(--gold); font-size:.82rem; letter-spacing:1px; margin:0 0 8px;}
  .course-title{
    font-family:'Reem Kufi', sans-serif;
    font-size:clamp(2.2rem, 8vw, 3.2rem);
    margin:0;
    color:var(--chalk);
  }
  .underline{
    display:inline-block;
    width:120px; height:6px;
    margin:16px auto 26px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 16px);
    border-radius:3px;
  }
  .course-desc{
    color:var(--chalk-dim);
    font-size:.95rem;
    line-height:1.9;
    margin:0 auto 34px;
    max-width:380px;
  }
  .chapter-btns{
    display:flex; flex-wrap:wrap; gap:14px; justify-content:center; max-width:600px;
  }
  .chapter-btn{
    background:var(--board-2);
    border:1.5px solid var(--gold);
    color:var(--gold);
    font-family:'Cairo', sans-serif;
    font-size:.95rem;
    font-weight:600;
    padding:13px 26px;
    border-radius:999px;
    cursor:pointer;
    transition:.2s;
  }
  .chapter-btn:hover{background:var(--gold); color:#16241f;}
  .add-chapter-hint{
    margin-top:30px;
    font-size:.78rem;
    color:var(--chalk-dim);
    border:1.5px dashed var(--teal-line);
    padding:10px 18px;
    border-radius:999px;
  }

  /* CHAPTER VIEW (list of lessons) */
  .hero{margin:38px 0 34px;}
  .hero h1{
    font-family:'Reem Kufi', sans-serif;
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    margin:0 0 10px;
    color:var(--chalk);
  }
  .hero p{color:var(--chalk-dim); font-size:1rem; max-width:520px; line-height:1.9; margin:0;}

  .timeline{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px,1fr));
    gap:20px;
    margin-top:20px;
  }
  .chap-card{
    position:relative;
    background:linear-gradient(180deg, var(--board-2), #16241f);
    border:1px solid var(--teal-line);
    border-radius:var(--radius);
    padding:22px 20px 20px;
    cursor:pointer;
    transition:transform .18s ease, border-color .18s ease;
  }
  .chap-card:hover{transform:translateY(-4px); border-color:var(--gold);}
  .chap-badge{
    width:46px;height:46px;
    border-radius:50%;
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Reem Kufi',sans-serif;
    font-size:.95rem;
    color:var(--gold);
    margin-bottom:14px;
    position:relative;
  }
  .chap-badge::before{
    content:'';
    position:absolute; inset:-6px;
    border:1.5px dashed rgba(215,160,52,.35);
    border-radius:50%;
  }
  .chap-title{font-size:1.08rem; font-weight:700; margin:0 0 6px; color:var(--chalk);}
  .chap-sub{font-size:.82rem; color:var(--chalk-dim); margin:0;}
  .chap-meta{margin-top:14px; display:flex; align-items:center; gap:6px; font-size:.75rem; color:var(--coral);}
  .chap-card.quiz{border-style:dashed;}
  .chap-card.quiz .chap-badge{border-color:var(--coral); color:var(--coral);}
  .chap-card.quiz .chap-badge::before{border-color:rgba(226,105,75,.35);}

  .add-note{
    margin-top:34px;
    border:1.5px dashed var(--teal-line);
    border-radius:var(--radius);
    padding:16px 18px;
    color:var(--chalk-dim);
    font-size:.85rem;
    line-height:1.9;
  }

  /* LESSON VIEW */
  .chap-header{display:flex; align-items:center; gap:14px; margin:30px 0 20px;}
  .chap-header .badge-big{
    width:58px;height:58px;
    border-radius:50%;
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Reem Kufi',sans-serif;
    font-size:1.1rem;
    color:var(--gold);
    flex-shrink:0;
  }
  .chap-header h2{font-family:'Reem Kufi', sans-serif; font-size:1.5rem; margin:0 0 4px;}
  .chap-header span{color:var(--chalk-dim); font-size:.85rem;}

  .video-block{margin-bottom:22px;}
  .video-block .v-label{font-size:.8rem; color:var(--gold); margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .video-frame-wrap{
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--teal-line);
    aspect-ratio:16/9;
    background:#0f1a16;
  }
  .video-frame-wrap iframe{width:100%; height:100%; border:0; display:block;}

  .video-thumb{
    position:relative;
    display:block;
    width:100%; height:100%;
    background-size:cover;
    background-position:center;
    cursor:pointer;
  }
  .video-thumb::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(15,26,22,.15), rgba(15,26,22,.55));
  }
  .play-btn{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:66px; height:66px;
    border-radius:50%;
    background:rgba(22,36,31,.7);
    border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    z-index:2;
    transition:.18s;
  }
  .video-thumb:hover .play-btn{background:var(--gold);}
  .play-btn svg{width:22px; height:22px; margin-right:-3px;}
  .video-thumb:hover .play-btn svg path{fill:#16241f;}
  .open-hint{
    position:absolute; bottom:12px; right:14px;
    z-index:2;
    font-size:.72rem;
    color:var(--chalk);
    background:rgba(15,26,22,.6);
    padding:5px 10px;
    border-radius:999px;
    border:1px solid var(--teal-line);
  }

  .notes-box{
    margin-top:28px;
    border-radius:var(--radius);
    border:1px solid var(--teal-line);
    background:repeating-linear-gradient(var(--board-2) 0 37px, var(--teal-line) 37px 38px);
    padding:16px 18px;
  }
  .notes-box .n-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .notes-box .n-head strong{font-size:.9rem; color:var(--chalk); font-family:'Reem Kufi', sans-serif; font-weight:400;}
  .save-state{font-size:.72rem; color:var(--chalk-dim);}
  textarea{
    width:100%; min-height:190px; background:transparent; border:none; outline:none; resize:vertical;
    color:var(--chalk); font-family:'Cairo', sans-serif; font-size:.95rem; line-height:38px; direction:rtl;
  }
  textarea::placeholder{color:rgba(237,232,218,0.35);}

  .chap-nav{display:flex; justify-content:space-between; margin-top:26px; gap:12px;}
  .nav-btn{
    flex:1; background:var(--board-2); border:1px solid var(--teal-line); color:var(--chalk-dim);
    padding:12px 14px; border-radius:10px; cursor:pointer; font-family:'Cairo', sans-serif; font-size:.85rem;
    transition:.18s; text-align:center;
  }
  .nav-btn:hover{border-color:var(--gold); color:var(--gold);}
  .nav-btn:disabled{opacity:.3; cursor:default;}
  .nav-btn:disabled:hover{border-color:var(--teal-line); color:var(--chalk-dim);}

  @media (max-width:520px){
    .wrap{padding:24px 14px 60px;}
    .chap-header{gap:10px;}
    .chap-header .badge-big{width:48px;height:48px;font-size:.9rem;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand" onclick="goCourseHome()">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 6c3-2 6-2 8 0v13c-2-2-5-2-8 0V6Z" stroke="#d7a034" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M20 6c-3-2-6-2-8 0v13c2-2 5-2 8 0V6Z" stroke="#d7a034" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      Math002
    </div>
    <div class="crumbs" id="crumbs"></div>
  </header>

  <!-- COURSE HOME -->
  <div class="view active" id="courseView">
    <div class="course-hero">
      <div class="course-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 6c3-2 6-2 8 0v13c-2-2-5-2-8 0V6Z" stroke="#d7a034" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M20 6c-3-2-6-2-8 0v13c2-2 5-2 8 0V6Z" stroke="#d7a034" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="course-eyebrow">منهج</p>
      <h1 class="course-title">Chapters Math002</h1>
      <div class="underline"></div>
      <p class="course-desc">اختر الفصل اللي تبي تذاكره. كل فصل فيه دروسه وفيديوهاته وملاحظاتك.</p>
      <div class="chapter-btns" id="chapterBtns"></div>
      <div class="add-chapter-hint" id="addHint">+ جاهز أضيف Chapter 4 و 5 و 6 أول ما ترسل روابطها</div>
    </div>
  </div>

  <!-- CHAPTER VIEW (lessons list) -->
  <div class="view" id="chapterView">
    <div class="hero">
      <h1 id="chapTitle"></h1>
      <p>افتح أي درس، شاهد الفيديو داخل الموقع، ودوّن ملاحظاتك تحته — تنحفظ تلقائي.</p>
    </div>
    <div class="timeline" id="timeline"></div>
    <div class="add-note">+ جاهز أضيف باقي دروس هذا الفصل أول ما ترسلها.</div>
  </div>

  <!-- LESSON VIEW -->
  <div class="view" id="lessonView">
    <div class="chap-header">
      <div class="badge-big" id="cvBadge"></div>
      <div>
        <h2 id="cvTitle"></h2>
        <span id="cvSub"></span>
      </div>
    </div>

    <div id="cvVideos"></div>

    <div class="notes-box">
      <div class="n-head">
        <strong>ملاحظاتي</strong>
        <span class="save-state" id="saveState">محفوظ</span>
      </div>
      <textarea id="notesArea" placeholder="اكتب هنا شرحك للدرس وأنت تتفرج... تنحفظ تلقائيًا."></textarea>
    </div>

    <div class="chap-nav">
      <button class="nav-btn" id="prevBtn">← الدرس السابق</button>
      <button class="nav-btn" id="nextBtn">الدرس التالي →</button>
    </div>
  </div>

</div>

<script>
  // ---- Course data: add more chapters / lessons here later ----
  const course = {
    name: 'Math002',
    chapters: [
      {
        id: 'ch3',
        num: '3',
        title: 'Chapter 3',
        lessons: [
          { id: '3-1', num: '3.1', title: 'الفصل 3.1', videos: ['fpIuXwTIdsw'] },
          { id: '3-3', num: '3.3', title: 'الفصل 3.3', videos: ['DkV8nNF1220'] },
          { id: '3-4', num: '3.4', title: 'الفصل 3.4', videos: ['ADwvf9NeAPY'] },
          { id: '3-6', num: '3.6', title: 'الفصل 3.6', videos: ['sdHKzYKrycE'] },
          { id: 'quiz-1', num: 'Q1', title: 'كويز 1 - الفصل 3', quiz: true, videos: ['JDqRBndVUr4', 'NrYg5leiuBg'] }
        ]
      }
    ]
  };

  const courseView = document.getElementById('courseView');
  const chapterView = document.getElementById('chapterView');
  const lessonView = document.getElementById('lessonView');
  const crumbs = document.getElementById('crumbs');
  const chapterBtns = document.getElementById('chapterBtns');

  function renderChapterButtons(){
    chapterBtns.innerHTML = '';
    course.chapters.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'chapter-btn';
      btn.textContent = ch.title;
      btn.onclick = () => openChapter(ch.id);
      chapterBtns.appendChild(btn);
    });
  }
  renderChapterButtons();

  function showView(view){
    [courseView, chapterView, lessonView].forEach(v => v.classList.remove('active'));
    view.classList.add('active');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function goCourseHome(){
    crumbs.innerHTML = '';
    showView(courseView);
  }

  function openChapter(chapterId){
    const ch = course.chapters.find(c => c.id === chapterId);
    if(!ch) return;

    document.getElementById('chapTitle').textContent = ch.title;

    const timeline = document.getElementById('timeline');
    timeline.innerHTML = '';
    ch.lessons.forEach(l => {
      const card = document.createElement('div');
      card.className = 'chap-card' + (l.quiz ? ' quiz' : '');
      card.onclick = () => openLesson(chapterId, l.id);
      card.innerHTML = `
        <div class="chap-badge">${l.num}</div>
        <p class="chap-title">${l.title}</p>
        <p class="chap-sub">${l.videos.length} ${l.videos.length > 1 ? 'فيديوهات' : 'فيديو'}</p>
        <div class="chap-meta">${l.quiz ? '● مراجعة' : '● درس'}</div>
      `;
      timeline.appendChild(card);
    });

    crumbs.innerHTML = `<span onclick="goCourseHome()">Math002</span><span class="sep">/</span><span>${ch.title}</span>`;
    showView(chapterView);
  }

  let saveTimer = null;

  function openLesson(chapterId, lessonId){
    const ch = course.chapters.find(c => c.id === chapterId);
    if(!ch) return;
    const idx = ch.lessons.findIndex(l => l.id === lessonId);
    if(idx === -1) return;
    renderLesson(ch, idx);
    crumbs.innerHTML = `<span onclick="goCourseHome()">Math002</span><span class="sep">/</span><span onclick="openChapter('${ch.id}')">${ch.title}</span><span class="sep">/</span><span>${ch.lessons[idx].title}</span>`;
    showView(lessonView);
  }

  function renderLesson(ch, idx){
    const l = ch.lessons[idx];
    document.getElementById('cvBadge').textContent = l.num;
    document.getElementById('cvTitle').textContent = l.title;
    document.getElementById('cvSub').textContent = l.quiz ? 'مراجعة وأسئلة' : 'شرح الدرس';

    const videosWrap = document.getElementById('cvVideos');
    videosWrap.innerHTML = '';
    l.videos.forEach((vid, i) => {
      const block = document.createElement('div');
      block.className = 'video-block';
      block.innerHTML = `
        <div class="v-label">${l.videos.length > 1 ? 'فيديو ' + (i+1) : 'الفيديو'}</div>
        <div class="video-frame-wrap">
          <a class="video-thumb" href="https://youtu.be/${vid}" target="_blank" rel="noopener"
             style="background-image:url('https://img.youtube.com/vi/${vid}/hqdefault.jpg')">
            <div class="play-btn">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z" fill="#ede8da"/></svg>
            </div>
            <span class="open-hint">فتح في يوتيوب ↗</span>
          </a>
        </div>
      `;
      videosWrap.appendChild(block);
    });

    const notesArea = document.getElementById('notesArea');
    const saved = localStorage.getItem('mathhub-notes-' + l.id);
    notesArea.value = saved || '';
    document.getElementById('saveState').textContent = saved ? 'محفوظ' : '';

    notesArea.oninput = () => {
      document.getElementById('saveState').textContent = 'جارٍ الحفظ...';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        localStorage.setItem('mathhub-notes-' + l.id, notesArea.value);
        document.getElementById('saveState').textContent = 'محفوظ';
      }, 500);
    };

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === ch.lessons.length - 1;
    prevBtn.onclick = () => idx > 0 && openLesson(ch.id, ch.lessons[idx-1].id);
    nextBtn.onclick = () => idx < ch.lessons.length-1 && openLesson(ch.id, ch.lessons[idx+1].id);
  }
</script>
</body>
</html>
